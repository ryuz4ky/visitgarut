name: VisitGarut 2.0 Branch QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/visitgarut-2-realignment]

permissions:
  contents: read

jobs:
  types-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run test:globe
      - run: npm run test:pulse
      - run: npm run test:pulse-activation
      - run: npm run test:youtube
      - run: npm run test:youtube-collection
      - run: npm run test:discovery
      - run: npm run test:research-insights
      - run: npm run test:directory
      - run: node scripts/test-schema.cjs
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
